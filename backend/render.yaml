services:
  - type: web
    name: localhub-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m scripts.seed_restaurants
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/localhub.db
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
